<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 · 줍줍딜</title>
<meta name="robots" content="noindex">
<style>
  :root{--ink:#17140f;--muted:#79715f;--paper:#fbf8f2;--accent:#d94e26;--line:#e7dfd0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    line-height:1.65;-webkit-font-smoothing:antialiased}
  .box{max-width:560px;margin:0 auto;padding:80px 20px}
  .brand{font-weight:800;font-size:20px;letter-spacing:-.05em;text-decoration:none;color:inherit}
  .brand i{font-style:normal;color:var(--accent)}
  h1{font-size:64px;line-height:1;letter-spacing:-.06em;margin:28px 0 8px}
  p{color:#3d382f;margin:0 0 18px}
  a.btn{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;
    font-weight:800;padding:12px 18px;border-radius:12px}
  hr{border:0;border-top:1px solid var(--line);margin:32px 0}
  small{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="box">
  <a class="brand" href="./">줍줍딜<i>.</i></a>
  <h1>404</h1>
  <p>찾으시는 페이지가 없습니다. 주소가 바뀌었거나 삭제되었을 수 있어요.</p>
  <a class="btn" href="./">자취생 필수템 비교표로 돌아가기 →</a>
  <hr>
  <small>이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</small>
</div>
</body>
</html>
